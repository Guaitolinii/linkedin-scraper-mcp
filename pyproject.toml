[project]
name = "linkedin-scraper-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets AI assistants research LinkedIn profiles, companies and jobs through your own browser session. Modified from linkedin-mcp-server (Apache-2.0)."
readme = "README.md"
requires-python = ">=3.12.4,<3.15"
authors = [
    { name = "Gustavo Guaitolini" }
]
license = "Apache-2.0"
# Declared rather than left to setuptools' default globs, which happen to cover
# NOTICE* today. Apache-2.0 §4(d) binds a derivative only to the notices this
# project actually distributes, so whether the file reaches the wheel is the
# whole point and not an incidental of the build backend.
#
# Measured with `uv build` at 4.23.0: the wheel carries
# linkedin_scraper_mcp-4.23.0.dist-info/licenses/NOTICE with a matching
# `License-File: NOTICE` in METADATA, and the sdist carries NOTICE at its root.
# Worth re-running when the build backend or its version changes.
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai",
    "llm",
    "anthropic",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
# fastmcp, httpx2 and mcp stop at the next minor. `uvx` resolves these ranges,
# not uv.lock, so a wider cap ships every new minor to users untested. Renovate
# raises a cap in a pull request that forwarder-compat.yml tests; see
# docs/decisions/2026-11-17-cap-the-mcp-ecosystem-at-the-next-minor.md.
dependencies = [
    "anyio>=4.13.0",
    "cryptography>=50.0.1",
    "fastmcp>=4.2.0,<4.3.0",
    "httpx2>=2.16.2,<2.17.0",
    "inquirer>=3.4.0",
    "mcp>=2.3.0,<2.4.0",
    "opentelemetry-api>=1.45.1",
    "packaging>=26.2",
    "patchright>=1.55.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.1.1",
    "pywin32>=312 ; sys_platform == 'win32'",
    "rich>=15.0.0",
    "starlette>=1.3.1",
]

[project.urls]
OriginalProject = "https://github.com/stickerdaniel/linkedin-mcp-server"

[project.scripts]
linkedin-scraper-mcp = "linkedin_scraper_mcp.__main__:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linkedin_scraper_mcp*"]
exclude = ["assets*", "docs*", "tests*"]

[tool.setuptools.package-data]
linkedin_scraper_mcp = ["py.typed"]

[tool.ruff.lint]
# Preserve Ruff's pre-0.16 default rule set instead of adopting new rules implicitly.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Ruff 0.16 added Markdown formatting; keep the formatter's previous file scope.
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --strict-markers -ra"
markers = [
    "browser_dom: evaluates extractor JS against a real chromium DOM; skipped when no browser is installed",
    "browser_contract: measures browser API behavior against real Chromium; skipped when no browser is installed",
    "slow: spawns real server processes; each case starts the full server graph",
    "browser_identity: the identity gate; fails rather than skips in CI",
]

[tool.coverage.run]
source = ["linkedin_scraper_mcp"]
branch = true
omit = ["linkedin_scraper_mcp/__main__.py"]

[tool.coverage.report]
fail_under = 45
show_missing = true

[dependency-groups]
dev = [
    "aiohttp>=3.14.4",
    "pre-commit>=4.6.2",
    "psutil>=7.2.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff==0.17.4",
    "ty>=0.0.1a12",
    "virtualenv>=21.14.9",
]
